services:
  mongo:
    image: mongo:7
    container_name: skillbridge-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: skillbridge
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge-api
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/skillbridge
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-production-secret}
      CLIENT_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: skillbridge-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
